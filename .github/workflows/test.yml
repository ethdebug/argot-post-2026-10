name: test
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: test-${{ github.ref }}
  # (every push to main gets its run; a PR's newer push replaces it)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run: { working-directory: inspector-app }
# The inspector app's whole gate (npm run test:full), split so its parts
# run side by side: the units; the e2e, one job a browser; the built
# site's smoke (npm run check)
jobs:
  units:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inspector-app/package-lock.json
      - run: npm ci
      - run: npm test
  browsers:
    strategy:
      fail-fast: false
      matrix:
        # (WebKit, the slowest on these runners, in two halves)
        include:
          - { browser: chromium, shard: 1/1 }
          - { browser: firefox, shard: 1/1 }
          - { browser: webkit, shard: 1/2 }
          - { browser: webkit, shard: 2/2 }
          - { browser: check }
    name: >-
      ${{ matrix.browser == 'check' && 'check'
      || format('e2e ({0} {1})', matrix.browser, matrix.shard) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # (check opens all three)
      BROWSERS: ${{ matrix.browser == 'check' && 'chromium firefox webkit' || matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inspector-app/package-lock.json
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ env.BROWSERS }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps $BROWSERS
      - if: steps.cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps $BROWSERS
      - if: matrix.browser != 'check'
        run: >-
          npx playwright test --project=${{ matrix.browser }}
          --shard=${{ matrix.shard }}
      - if: matrix.browser == 'check'
        run: npm run check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-${{ strategy.job-index }}
          path: inspector-app/test-results/
          retention-days: 7
