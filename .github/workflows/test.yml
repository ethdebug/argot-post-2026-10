name: test
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
# (every push to main gets its own run, to the end; a PR's newer push
# replaces its run)
concurrency:
  group: >-
    test-${{ github.event_name == 'pull_request' && github.ref
    || github.sha }}
  cancel-in-progress: true
defaults:
  run: { working-directory: inspector-app }
# The inspector app's whole gate (npm run test:full), split so its parts
# run side by side: the units; the e2e, one job a browser
jobs:
  units:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inspector-app/package-lock.json
      - run: npm ci
      - run: npm test
  browsers:
    strategy:
      fail-fast: false
      matrix:
        # (WebKit, the slowest on these runners, in three parts)
        include:
          - { browser: chromium, shard: 1/1 }
          - { browser: firefox, shard: 1/1 }
          - { browser: webkit, shard: 1/3 }
          - { browser: webkit, shard: 2/3 }
          - { browser: webkit, shard: 3/3 }
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inspector-app/package-lock.json
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ env.BROWSERS }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps $BROWSERS
      - if: steps.cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps $BROWSERS
      - run: >-
          npx playwright test --project=${{ matrix.browser }}
          --shard=${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-${{ strategy.job-index }}
          path: inspector-app/test-results/
          retention-days: 7
