name: pages
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The site: the repo's files, with the inspector app built and put at
  # demos/inspector/ (inspector-app/bin/site.sh)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inspector-app/package-lock.json
      - run: npm ci
        working-directory: inspector-app
      - run: npm run build
        working-directory: inspector-app
      - run: sh inspector-app/bin/site.sh
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
